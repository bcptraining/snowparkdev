[project]
name = "snowparkdev"
version = "0.1.0"
description = "Snowflake Snowpark project containing multiple snowpark native apps"
authors = [
    { name = "Cory", email = "bcpurkistraining@gmail.com" }
]
dependencies = [
    "snowflake-snowpark-python==1.33.0",
    "snowflake-core==1.5.1",
    "snowflake-cli-labs==3.10.0",
    "numpy",
    "pandas",
    "pyarrow<19.0.0"
]
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
